name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # src/config/notion-fallback.json is gitignored and generated by the prebuild.
      # Without NOTION_API_KEY the script only bootstraps an empty file (no network).
      - name: Bootstrap Notion fallback file
        run: bun run src/scripts/prebuild.ts

      - name: Lint & format (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun test

      # No NOTION_API_KEY here on purpose: prebuild skips the Notion sync and the
      # build is hermetic. Production builds (Cloudflare Workers Builds) have it.
      - name: Build
        run: bun run build
