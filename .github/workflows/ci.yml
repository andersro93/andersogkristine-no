name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN: the job only reads the repo (checkout, install,
# lint, test, build) and never writes back, so read-only contents is enough.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Installs the exact runtimes pinned in mise.toml (bun, node) and caches them
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Show runtime versions
        run: |
          mise ls --current
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # src/config/notion-fallback.json is gitignored and generated by the prebuild.
      # Without NOTION_API_KEY the script only bootstraps an empty file (no network).
      - name: Bootstrap Notion fallback file
        run: bun run src/scripts/prebuild.ts

      - name: Lint & format (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun test

      # No NOTION_API_KEY here on purpose: prebuild skips the Notion sync and the
      # build is hermetic. Production builds (Cloudflare Workers Builds) have it.
      - name: Build
        run: bun run build
